{% extends 'projects/base.html' %}
{% block title %}Delete School{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header bg-danger text-white"><i class="fas fa-exclamation-triangle"></i> Confirm Delete</div>
            <div class="card-body">
                <p>Are you sure you want to delete "{{ school.name }}"?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Yes, Delete</button>
                    <a href="{% url 'school_detail' school.id %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
