{% extends 'projects/base.html' %}
{% block title %}Delete Grade{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card">
            <div class="card-header bg-danger text-white"><i class="fas fa-exclamation-triangle"></i> Confirm Delete</div>
            <div class="card-body">
                <p>Are you sure you want to delete "{{ grade.get_grade_display }}"?</p>
                <p><strong>Warning:</strong> This will delete all associated students!</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Yes, Delete</button>
                    <a href="{% url 'grade_detail' grade.id %}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
