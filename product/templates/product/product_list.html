<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f6f9;
            padding: 40px;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #007BFF;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #f8f9fa;
        }

        tr:hover {
            background: #eaf4ff;
            transition: 0.3s;
        }

        td[colspan="3"] {
            text-align: center;
            font-weight: bold;
            color: #666;
            background: #f1f1f1;
        }

        @media (max-width: 768px) {
            table {
                width: 100%;
            }

            th,
            td {
                padding: 10px;
                font-size: 14px;
            }

            body {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<h2>Product Listing</h2>

<table>
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Description</th>
    </tr>

    {% for product in products %}
    <tr>
        <td>{{ product.name }}</td>
        <td>Rs. {{ product.price }}</td>
        <td>{{ product.description }}</td>
    </tr>
    {% endfor %}

    <tr>
        <td colspan="3">No more products available</td>
    </tr>

</table>

</body>
</html>
