<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:linear-gradient(135deg,#86c2db,#77c7e2,#2c5364);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

.card{
    width:420px;
    border:none;
    border-radius:20px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    box-shadow:0 10px 25px rgba(0,0,0,.4);
}

.btn-custom{
    width:100%;
}

#message{
    font-size:20px;
    font-weight:bold;
    min-height:40px;
    
}

.history{
    max-height:120px;
    overflow:auto;
}

.win{
    animation:flash .8s infinite alternate;
}

@keyframes flash{
    from{
        transform:scale(1);
        color:#00ff7f;
    }
    to{
        transform:scale(1.08);
        color:yellow;
    }
}

input{
    text-align:center;
    font-size:22px !important;
}

.badge{
    font-size:15px;
}
</style>

</head>
<body>

<div class="card p-4">

<h2 class="text-center mb-3">🎯 Number Guessing Game</h2>


<p class="text-center">
Guess a number between
<span class="badge bg-warning text-dark">1</span>
and
<span class="badge bg-warning text-dark">10</span>
</p>

<input
type="number"
id="guessInput"
class="form-control mb-3"
placeholder="Enter your guess">

<button class="btn btn-primary btn-custom mb-2" onclick="checkGuess()">
Guess
</button>

<button class="btn btn-success btn-custom mb-3" onclick="restartGame()">
Restart Game
</button>

<div id="message" class="text-center text-warnin text-dark "></div>

<div class="text-center mt-2">
Attempts:
<span id="attempts">0</span>
</div>

<hr>

<h5>Guess History</h5>

<div id="history" class="history text-light"></div>

</div>

<script>

let secretNumber;
let attempts;
let history;

function startGame(){
    secretNumber=Math.floor(Math.random()*9)+1;
    attempts=0;
    history=[];
    document.getElementById("attempts").innerText=0;
    document.getElementById("message").innerHTML="";
    document.getElementById("history").innerHTML="";
    document.getElementById("guessInput").value="";
    document.getElementById("message").classList.remove("win");
}

function checkGuess(){

    const input=document.getElementById("guessInput");
    const guess=parseInt(input.value);

    if(isNaN(guess)){
        alert("Please enter a number.");
        return;
    }

    if(guess<1 || guess>100){
        alert("Enter a number between 1 and 10.");
        return;
    }

    attempts++;
    document.getElementById("attempts").innerText=attempts;

    history.push(guess);
    document.getElementById("history").innerHTML=
        history.join(", ");

    if(guess<secretNumber){

        document.getElementById("message").innerHTML=
        "📉 Too Low! Try Again.";

    }

    else if(guess>secretNumber){

        document.getElementById("message").innerHTML=
        "📈 Too High! Try Again.";

    }

    else{

        document.getElementById("message").innerHTML=
        "🎉 Congratulations! You guessed it in "+attempts+" attempts.";
        secretNumber=Math.floor(Math.random()*9)+1;

        document.getElementById("message").classList.add("win");
    }

    input.value="";
    input.focus();
}

function restartGame(){
    startGame();
}

document.getElementById("guessInput")
.addEventListener("keypress",function(e){
    if(e.key==="Enter"){
        checkGuess();
    }
});

startGame();

</script>

</body>
</html>
