<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Facebook Clone</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
    background:#f0f2f5;
    font-family:Arial, Helvetica, sans-serif;
}

.logo{
    color:#1877f2;
    font-size:60px;
    font-weight:bold;
}

.card{
    border:none;
    border-radius:12px;
}

.story{
    width:110px;
    height:190px;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
}

.story img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.post-input{
    border:none;
    outline:none;
    width:100%;
}

.icon-btn:hover{
    background:#e4e6eb;
}

.sidebar-item{
    padding:10px;
    border-radius:10px;
    cursor:pointer;
}

.sidebar-item:hover{
    background:#e4e6eb;
}

.online{
    width:10px;
    height:10px;
    background:limegreen;
    border-radius:50%;
    position:absolute;
    bottom:2px;
    right:5px;
    border:2px solid white;
}

.contact{
    position:relative;
}

.post-img{
    width:100%;
    border-radius:10px;
}
</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar bg-white shadow-sm sticky-top">

<div class="container-fluid">


<div class="d-flex align-items-center">

<h3 class="text-primary fw-bold me-3">facebook</h3>

<input class="form-control rounded-pill" placeholder="Search Facebook">

</div>

<div>

<button class="btn btn-light rounded-circle">🏠</button>

<button class="btn btn-light rounded-circle">👥</button>

<button class="btn btn-light rounded-circle">🎥</button>

<button class="btn btn-light rounded-circle">🔔</button>

</div>

</div>

</nav>


<div class="container-fluid mt-3">

<div class="row">

<!-- LEFT SIDEBAR -->

<div class="col-lg-3 d-none d-lg-block">

<div class="sidebar-item">🏠 Home</div>

<div class="sidebar-item">👥 Friends</div>

<div class="sidebar-item">💬 Messenger</div>

<div class="sidebar-item">🎮 Gaming</div>

<div class="sidebar-item">📺 Watch</div>

<div class="sidebar-item">⚙ Settings</div>

</div>

<!-- CENTER -->

<div class="col-lg-6">

<!-- Stories -->

<div class="d-flex gap-3 overflow-auto mb-3">

<div class="story shadow">

<img src="https://picsum.photos/200/300?1">

</div>

<div class="story shadow">

<img src="https://picsum.photos/200/300?2">

</div>

<div class="story shadow">

<img src="https://picsum.photos/200/300?3">

</div>

<div class="story shadow">

<img src="https://picsum.photos/200/300?4">

</div>

</div>


<!-- Create Post -->

<div class="card p-3 shadow-sm mb-3">

<div class="d-flex">

<img src="https://i.pravatar.cc/50"
class="rounded-circle me-3">

<input
class="post-input"
placeholder="What's on your mind?"
id="postText">

</div>

<hr>

<div class="text-center">

<button class="btn btn-primary"
onclick="createPost()">
Post
</button>

</div>

</div>

<!-- Posts -->

<div id="posts">

<div class="card shadow-sm mb-3">

<div class="card-body">

<div class="d-flex align-items-center">

<img src="https://i.pravatar.cc/50?img=5"
class="rounded-circle me-2">

<div>

<b>John Doe</b>

<div class="text-muted small">2 hrs ago</div>

</div>

</div>

<p class="mt-3">
Enjoying a beautiful day! 🌞
</p>

<img
src="https://picsum.photos/700/400"
class="post-img">

<hr>

<div class="d-flex justify-content-around">

<button class="btn btn-light">👍 Like</button>

<button class="btn btn-light">💬 Comment</button>

<button class="btn btn-light">↗ Share</button>

</div>

</div>

</div>

</div>

</div>

<!-- RIGHT SIDEBAR -->

<div class="col-lg-3 d-none d-lg-block">

<div class="card shadow-sm">

<div class="card-header">

<b>Contacts</b>

</div>

<div class="card-body">

<div class="d-flex align-items-center mb-3 contact">

<img src="https://i.pravatar.cc/45?img=10"
class="rounded-circle me-2">

Alice

<span class="online"></span>

</div>

<div class="d-flex align-items-center mb-3 contact">

<img src="https://i.pravatar.cc/45?img=11"
class="rounded-circle me-2">

David

<span class="online"></span>

</div>

<div class="d-flex align-items-center mb-3 contact">

<img src="https://i.pravatar.cc/45?img=12"
class="rounded-circle me-2">

Emma

<span class="online"></span>

</div>

</div>

</div>

</div>

</div>

</div>


<script>

function createPost(){

let text=document.getElementById("postText").value;

if(text===""){
alert("Write something!");
return;
}

let post=`

<div class="card shadow-sm mb-3">

<div class="card-body">

<div class="d-flex align-items-center">

<img src="https://i.pravatar.cc/50"

class="rounded-circle me-2">

<div>

<b>You</b>

<div class="small text-muted">
Just now
</div>

</div>

</div>

<p class="mt-3">
${text}
</p>

<hr>

<div class="d-flex justify-content-around">

<button class="btn btn-light">
👍 Like
</button>

<button class="btn btn-light">
💬 Comment
</button>

<button class="btn btn-light">
↗ Share
</button>

</div>

</div>

</div>

`;

document.getElementById("posts").innerHTML=
post+
document.getElementById("posts").innerHTML;

document.getElementById("postText").value="";

}

</script>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
