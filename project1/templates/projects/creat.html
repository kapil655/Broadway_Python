{% extends 'base/base.html' %}

{% block container %}

<style>
    .student-form-container {
        max-width: 500px;
        margin: 20px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .top-buttons {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
    }

    .btn {
        padding: 10px 18px;
        border-radius: 8px;
        color: white;
        text-decoration: none;
        font-weight: bold;
    }

    .add-btn {
        background: #2563eb;
    }

    .add-btn:hover {
        background: #1d4ed8;
    }

    .list-btn {
        background: #dc2626;
    }

    .list-btn:hover {
        background: #b91c1c;
    }

    .student-form-title {
        text-align: center;
        font-size: 28px;
        font-weight: bold;
        color: #1f2937;
        margin-bottom: 25px;
    }

    form p {
        margin-bottom: 15px;
    }

    form label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
    }

    form input,
    form select,
    form textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
    }

    form input:focus,
    form select:focus,
    form textarea:focus {
        outline: none;
        border-color: #2563eb;
    }

    .submit-btn {
        width: 100%;
        background: #2563eb;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        margin-top: 10px;
    }

    .submit-btn:hover {
        background: #1d4ed8;
    }
</style>


<div class="student-form-container">


    <div class="top-buttons">

        <!-- Add Student -->
        <a href="{% url 'create-student' %}" class="btn add-btn">
            - Delete Student
        </a>


        <!-- Student List -->
        <a href="{% url 'view-student' %}" class="btn list-btn">
            👨‍🎓 Student List
        </a>

    </div>


    <h1 class="student-form-title">
        Add Student Information
    </h1>


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="submit-btn">
            Submit
        </button>

    </form>


</div>


{% endblock %}
