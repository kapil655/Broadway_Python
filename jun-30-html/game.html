<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .container{
            background:#fff;
            padding:40px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
            width:300px;
        }

        h1{
            margin-bottom:20px;
            color:#333;
        }

        #count{
            font-size:60px;

            color:#007BFF;
            margin-bottom:25px;
        }

        button{
            padding:12px 25px;
            font-size:18px;
            border:none;
            border-radius:8px;
            background:#007BFF;
            color:white;
            cursor:pointer;
            transition:0.3s;
        }
        button:nth-child(1){
            height: 60px;
        }

        #reset{
            margin-top:10px;
             height: 60px;
        }
        .btn{
            display:Flex;
            gap:10px
           
        }
        button:hover{
            background:#0056b3;
            transform:scale(1.05);
        }

        button:active{
            transform:scale(0.95);
        }
    </style>
</head>

</body>
</html>
