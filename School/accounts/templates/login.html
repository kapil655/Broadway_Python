<!DOCTYPE html>
<html>
<head>
    <title>Login - School Management</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="w3-container w3-padding-64">
        <div class="w3-card-4 w3-white w3-padding" style="max-width:400px;margin:auto;border-radius:10px;">
            
            <div class="w3-center">
                <h2><i class="fa fa-user-circle w3-text-blue"></i> Login</h2>
                <div class="w3-border-bottom w3-border-blue" style="width:60px;margin:10px auto;"></div>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="w3-panel {% if message.tags == 'success' %}w3-green{% else %}w3-red{% endif %} w3-round">
                        <i class="fa fa-{% if message.tags == 'success' %}check-circle{% else %}exclamation-triangle{% endif %}"></i> 
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" class="w3-container">
                {% csrf_token %}
                
                <div class="w3-margin-bottom">
                    <label class="w3-text-grey"><i class="fa fa-user w3-text-blue"></i> Username</label>
                    <input type="text" name="username" class="w3-input w3-border w3-round" placeholder="Enter username" required>
                </div>

                <div class="w3-margin-bottom">
                    <label class="w3-text-grey"><i class="fa fa-lock w3-text-blue"></i> Password</label>
                    <input type="password" name="password" class="w3-input w3-border w3-round" placeholder="Enter password" required>
                </div>

                <button type="submit" class="w3-btn w3-blue w3-round w3-block">
                    <i class="fa fa-sign-in"></i> Login
                </button>
            </form>

            <div class="w3-center w3-margin-top">
                <p class="w3-small w3-text-grey">Default Admin: admin / password123</p>
            </div>
        </div>
    </div>
</body>
</html>
