<!DOCTYPE html>
<html>
<head>
    <title>Delete Student</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="w3-container w3-padding-32">
        <div class="w3-card-4 w3-white w3-padding" style="max-width:500px;margin:auto;">
            
            <div class="w3-center">
                <h2 class="w3-text-red"><i class="fa fa-trash"></i> Delete Student</h2>
                <div class="w3-border-bottom w3-border-red" style="width:60px;margin:10px auto;"></div>
            </div>

            <div class="w3-panel w3-pale-red w3-round">
                <div class="w3-center">
                    <i class="fa fa-exclamation-triangle" style="font-size:36px;color:#f44336;"></i>
                    <p><strong>⚠️ Are you sure?</strong></p>
                    <p>This action cannot be undone!</p>
                </div>
            </div>

            <div class="w3-card w3-grey w3-round w3-padding">
                <div class="w3-row w3-margin-bottom">
                    <div class="w3-col s4"><strong>Student ID:</strong></div>
                    <div class="w3-col s8"><span class="w3-tag w3-blue w3-round">{{ student.student_id }}</span></div>
                </div>
                <div class="w3-row w3-margin-bottom">
                    <div class="w3-col s4"><strong>Name:</strong></div>
                    <div class="w3-col s8">{{ student.first_name }} {{ student.last_name }}</div>
                </div>
                <div class="w3-row w3-margin-bottom">
                    <div class="w3-col s4"><strong>Class:</strong></div>
                    <div class="w3-col s8">{{ student.class_name }}</div>
                </div>
                <div class="w3-row w3-margin-bottom">
                    <div class="w3-col s4"><strong>Email:</strong></div>
                    <div class="w3-col s8">{{ student.email|default:"—" }}</div>
                </div>
                <div class="w3-row">
                    <div class="w3-col s4"><strong>Phone:</strong></div>
                    <div class="w3-col s8">{{ student.phone_number }}</div>
                </div>
            </div>

            <form method="POST" class="w3-margin-top">
                {% csrf_token %}
                <div class="w3-row">
                    <div class="w3-col s6">
                        <button type="submit" class="w3-btn w3-red w3-round w3-block">
                            <i class="fa fa-trash"></i> Confirm Delete
                        </button>
                    </div>
                    <div class="w3-col s6">
                        <a href="{% url 'student_list' %}" class="w3-btn w3-grey w3-round w3-block">
                            <i class="fa fa-times"></i> Cancel
                        </a>
                    </div>
                </div>
            </form>
            
        </div>
    </div>
</body>
</html>
