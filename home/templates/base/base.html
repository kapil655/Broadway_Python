<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} Dashboard {% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

    <!-- ================= Sidebar ================= -->
    <aside id="sidebar"
        class="fixed top-0 left-0 h-screen w-64 bg-slate-900 text-white shadow-lg transform -translate-x-full md:translate-x-0 transition-transform duration-300 z-50">

        <!-- Logo -->
        <div class="h-16 flex items-center justify-center border-b border-slate-700">
            <h1 class="text-2xl font-bold">Dashboard</h1>
        </div>

        <!-- Menu -->
        <nav class="mt-6 px-4">
            <ul class="space-y-2">

                <li>
                    <a href="{% url 'dashboard' %}"
                        class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800">

                        <span>🏠</span>
                        Dashboard
                </li>

                <li>
                    <a href="{% url 'student' %}"
                        class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">
                        <span>👤</span>
                        Students
                    </a>
                </li>

                <li>
                    <a href="{% url 'grade-list' %}"
                        class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">
                        <span>📄</span>
                        Grade
                    </a>
                </li>

                <li>
                    <a href="{% url 'create' %}"
                        class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">
                        <span>📦</span>
                        Product
                    </a>
                </li>

                <li>
                    <a href="{% url 'project-create' %}"
                        class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">
                        <span>⚙️</span>
                        Home
                    </a>

                    <a href="{% url 'create-student' %}"
                        class="flex items-center gap-3 px-4 py-3 rounded-lg hover:bg-slate-800 transition">
                        <span>🚀</span>
                        Projects
                    </a>
                </li>
            </ul>
        </nav>

    </aside>

    <!-- Overlay -->
    <div id="overlay" class="fixed inset-0 bg-black/50 hidden z-40 md:hidden"></div>

    <!-- ================= Navbar ================= -->
    <header
        class="fixed top-0 left-0 md:left-64 right-0 h-16 bg-white shadow flex items-center justify-between px-6 z-30">

        <div class="flex items-center gap-4">

            <button id="menuBtn" class="md:hidden text-3xl">
                ☰
            </button>

            <h2 class="text-xl font-semibold text-slate-700">
                Dashboard
            </h2>

        </div>

        <div class="flex items-center gap-5">

            <button class="relative text-xl">
                🔔
                <span
                    class="absolute -top-2 -right-2 h-5 w-5 rounded-full bg-red-500 text-white text-xs flex items-center justify-center">
                    3
                </span>
            </button>

            <img src="https://i.pravatar.cc/40" class="w-10 h-10 rounded-full border" alt="Profile">

        </div>

    </header>

    <!-- ================= Main Content ================= -->
    <main class="md:ml-64 mt-16 p-6">
        {% block container %}


        {% endblock %}



    </main>


</body>

</html>
