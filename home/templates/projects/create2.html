{% extends 'base/base.html' %}

{% block container %}

<style>
    .form-container {
        max-width: 500px;
        margin: 30px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .form-title {
        font-size: 28px;
        font-weight: bold;
        color: #1f2937;
        text-align: center;
        margin-bottom: 25px;
    }

    form p {
        margin-bottom: 18px;
    }

    form label {
        display: block;
        font-weight: 600;
        color: #374151;
        margin-bottom: 6px;
    }

    form input,
    form select,
    form textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
        transition: 0.3s;
    }

    form input:focus,
    form select:focus,
    form textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }

    .submit-btn {
        width: 100%;
        background: #2563eb;
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 15px;
    }

    .submit-btn:hover {
        background: #1d4ed8;
    }

    .errorlist {
        color: #dc2626;
        font-size: 14px;
        list-style: none;
        padding: 0;
        margin-bottom: 10px;
    }
</style>


<div class="form-container">

    <h2 class="form-title">
        Create Grade
    </h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="submit-btn">
            Submit
        </button>

    </form>

</div>


{% endblock %}
