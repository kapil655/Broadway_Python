{% extends 'base.html' %}
<style>
    body {
    background-color: #f5f7fa;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1000px;
    margin: 40px auto;
    background: white;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

h1 {
    text-align: center;
    margin-bottom: 20px;
    color: #333;
}

.btn-primary {
    margin-bottom: 15px;
}

table {
    width: 100%;
    border-collapse: collapse;
}

table thead {
    background-color: #0d6efd;
    color: white;
}

table th,
table td {
    padding: 12px;
    border: 1px solid #ddd;
    text-align: center;
}

table tbody tr:nth-child(even) {
    background-color: #f8f9fa;
}

table tbody tr:hover {
    background-color: #e9ecef;
}

.btn {
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 5px;
    color: white;
    margin: 2px;
}

.btn-warning {
    background: #ffc107;
    color: black;
}

.btn-danger {
    background: #dc3545;
}

.btn-info {
    background: #0dcaf0;
    color: black;
}

.btn-primary {
    background: #0d6efd;
}

.text-center {
    text-align: center;
}
</style>

{% block content %}
<div class="container">
    <h1>Student List</h1>
    
    <!-- ✅ FIXED: Removed 'product:' namespace -->
    <a href="{% url 'student-create' %}" class="btn btn-primary">Add Student</a>
    
    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Grade</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.id }}</td>
                <td>{{ student.name }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.grade }}</td>
                <td>
                    <!--  FIXED: Removed 'product:' namespace -->
                    <a href="{% url 'student-update' student.id %}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{% url 'student-delete' student.id %}" class="btn btn-sm btn-danger">Delete</a>
                    <a href="{% url 'student-detail' student.id %}" class="btn btn-sm btn-info">View</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5" class="text-center">No students found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
