<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 22px;
        }

        form {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            background: #dc3545;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #b02a37;
        }

        a {
            background: #6c757d;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 16px;
        }

        a:hover {
            background: #5a6268;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>
            Are you sure you want to delete {{ student.name }}?
        </h2>

        <form method="POST">
            {% csrf_token %}

            <button type="submit">
                Delete
            </button>

            <a href="{% url 'student' %}">
                Cancel
            </a>

        </form>

    </div>

</body>
</html>
