{% extends 'base/base.html' %}

{% block container %}

<style>
    .form-box {
        max-width: 500px;
        margin: 30px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .form-box form p {
        margin-bottom: 18px;
    }

    .form-box label {
        display: block;
        font-weight: 600;
        color: #374151;
        margin-bottom: 6px;
    }

    .form-box input,
    .form-box select,
    .form-box textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
    }

    .form-box input:focus,
    .form-box select:focus,
    .form-box textarea:focus {
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
    }

    .submit-btn {
        width: 100%;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 15px;
    }

    .submit-btn:hover {
        background: #1d4ed8;
    }

    .errorlist {
        color: red;
        list-style: none;
        padding: 0;
        font-size: 14px;
    }
</style>


<div class="form-box">

    <h2 class="text-2xl font-bold text-gray-800 mb-5">
        Create Form
    </h2>


    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="submit-btn">
            Submit
        </button>

    </form>

</div>


{% endblock %}
